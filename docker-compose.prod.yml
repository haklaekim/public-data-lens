# 공개 배포(MCP 전용) — 웹 UI 없이 gateway + mcp + api(정본 URI 해소용)만 노출한다.
#
# 실행:  docker compose -f docker-compose.prod.yml up -d --build
# 갱신:  COMPOSE_FILE=docker-compose.prod.yml scripts/monthly_update.sh <CSV> <YYYY-MM>
#
# 전제:
#  - TLS는 상위 LB/프록시에서 종단한다(커스텀 커넥터는 https 필수).
#  - LB 뒤에서는 .env의 GATEWAY_REAL_IP_FROM에 LB 대역(CIDR)을 반드시 지정한다 —
#    미지정 시 모든 사용자가 LB IP 하나로 묶여 IP당 rate limit이 서비스 전체 한도가 된다.
#  - 카탈로그는 배포 전에 빌드되어 있어야 한다(scripts/monthly_update.sh 또는 build_catalog.py).
#  - api·mcp는 단일 워커 전제(rate limit이 프로세스 메모리 기반) — 복제 수는 1로 유지한다.
#
# 공개 표면: /(랜딩) · /mcp · /projects/datanav/** · /api/status · /api/resources/privacy(/privacy)
# 비공개: 그 외 /api/** 전부(웹용 REST·컨시어지). ANTHROPIC_API_KEY도 불필요하다.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"   # §10: 컨테이너 로그도 무한 보존하지 않는다
    max-file: "5"

services:
  api:
    build: apps/server
    environment:
      DATANAV_TRUST_PROXY: "1"
      # 웹 프론트 없음 — 기본은 CORS 비허용(브라우저 교차 출처 호출 차단)
      DATANAV_CORS_ORIGINS: ${DATANAV_CORS_ORIGINS:-}
      DATANAV_RATE_LIMIT_PER_MIN: ${DATANAV_RATE_LIMIT_PER_MIN:-120}
    volumes:
      - ./data:/app/data
      - ./docs:/app/docs:ro  # 개인정보 고지문 서빙용
    logging: *logging
    restart: unless-stopped
    healthcheck:
      # 카탈로그 미빌드(503)면 unhealthy — 배포 전 빌드가 전제 조건이다
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/status', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  mcp:
    build: apps/server
    command: ["python", "-m", "datanav.api.mcp_server", "--http"]
    environment:
      DATANAV_MCP_HOST: 0.0.0.0
      DATANAV_MCP_PORT: "8300"
      # 서비스 도메인 지정 시 DNS 리바인딩 보호(Host 헤더 검증) 활성화 — 예: data.datahub.kr
      DATANAV_MCP_ALLOWED_HOSTS: ${DATANAV_MCP_ALLOWED_HOSTS:-}
    volumes:
      - ./data:/app/data:ro  # 읽기 전용 — MCP는 카탈로그를 조회만 한다
    logging: *logging
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8300), 2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  gateway:
    build: apps/gateway
    depends_on:
      - api
      - mcp
    environment:
      # LB/프록시 신뢰 대역(CIDR 1개). 기본값 127.0.0.1은 no-op(직접 노출용).
      GATEWAY_REAL_IP_FROM: ${GATEWAY_REAL_IP_FROM:-127.0.0.1}
    ports:
      - "${GATEWAY_PORT:-8088}:80"
    logging: *logging
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
