# 컨시어지 서비스(B) 전용 — 공용 nginx.conf에서 /mcp 프록시를 뺀 구성.
# B 스택에는 mcp 서비스가 없다(MCP·정본 URI는 A 배포의 몫).
# B는 게이트웨이 없이 이 nginx가 공개 진입점이므로, A 게이트웨이와 동일한
# §10 로그 정책(익명 형식·옵트아웃 제외)과 레이트 리밋을 여기서 적용한다.

# ${WEB_REAL_IP_FROM}: 신뢰할 LB/프록시 대역(CIDR). 직접 노출 시 기본값 127.0.0.1은 no-op.
set_real_ip_from ${WEB_REAL_IP_FROM};
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# §10: 원 IP·쿼리 문자열(검색어)을 기록하지 않는 익명 접근 로그.
log_format datanav_anon '$time_iso8601 "$request_method $uri" $status $body_bytes_sent $request_time';

# 옵트아웃(DNT/GPC/X-Datanav-No-Log) 요청은 접근 로그에서도 제외한다(고지문과 일치).
map "$http_dnt:$http_sec_gpc:$http_x_datanav_no_log" $datanav_loggable {
    ~(^|:)1(:|$)  0;
    default       1;
}

limit_req_zone $binary_remote_addr zone=concierge_zone:10m rate=5r/s;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log datanav_anon if=$datanav_loggable;
    # 한도 초과 메시지에는 클라이언트 IP가 포함되므로 notice로 내려 error 로그에서 제외한다.
    limit_req_log_level notice;
    error_log /var/log/nginx/error.log warn;

    add_header X-Content-Type-Options nosniff always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        limit_req zone=concierge_zone burst=30 nodelay;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # X-Real-IP는 항상 덮어써서 클라이언트 위조를 차단한다(API의 DATANAV_TRUST_PROXY=1과 짝)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSE(컨시어지 진행 스트리밍) 실시간 중계
        proxy_buffering off;
        proxy_read_timeout 300s;
    }


    # 배포 갱신이 즉시 반영되도록: 진입 문서는 no-cache, 해시 명명 자산은 장기 캐시
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        limit_req zone=concierge_zone burst=30 nodelay;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
